name: Build NDS Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          node-version: 22

      - name: Build NDS
        run: |
          make

      - name: Upload NDS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: princess-life-ds
          path: princess_life_ds.nds
